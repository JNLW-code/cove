<title>Cove full mockup</title>
<style>

Object.keys(STATES).forEach((k, i) => { const b = document.createElement("button"); b.textContent = k; if (i === 0) b.classList.add("on"); b.onclick = () => show(k); seg.appendChild(b); });
function show(k) { [...seg.children].forEach(b => b.classList.toggle("on", b.textContent === k)); stage.innerHTML = STATES[k].html; cap.textContent = STATES[k].cap; }
document.querySelectorAll("button[data-theme]").forEach(b => b.onclick = () => { document.querySelectorAll("button[data-theme]").forEach(x => x.classList.toggle("on", x === b)); document.getElementById("screen").classList.toggle("matte", b.dataset.theme === "matte"); });
function fit() { document.documentElement.style.setProperty("--s", Math.min(1, (document.body.clientWidth - 32) / 1440)); }
window.addEventListener("resize", fit); fit(); show("Permission + Always");
